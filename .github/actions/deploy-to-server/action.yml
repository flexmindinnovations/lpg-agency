name: Deploy to server
description: >-
  Runs infrastructure/deploy/deploy-image.sh on the droplet over SSH, using a
  restricted key (forced command) and a short-lived GHCR token passed on stdin.

inputs:
  sha:
    description: Full 40-character commit SHA whose images should be deployed
    required: true
  host:
    description: Droplet hostname or IP
    required: true
  ssh-key:
    description: Private key for the restricted deploy key
    required: true
  host-key:
    description: Server's public host key line for known_hosts (from ssh-keyscan)
    required: true
  ghcr-user:
    description: GitHub username for the registry login
    required: true
  ghcr-token:
    description: Token with read access to the packages (GITHUB_TOKEN)
    required: true
  fcm-service-account:
    description: >-
      Optional Firebase service-account JSON for push notifications. When set,
      the server writes it into integrations.env; when empty, the server's
      existing push settings are left untouched.
    required: false
    default: ""

  storage-env:
    description: >-
      Optional object-storage settings as KEY=VALUE lines (LPG_STORAGE_ENDPOINT_URL,
      _ACCESS_KEY, _SECRET_KEY, _BUCKET, _REGION). When set, the server writes them
      into .env; when empty, the server's existing storage settings are left alone.
    required: false
    default: ""

  payments-env:
    description: >-
      Optional Razorpay settings as KEY=VALUE lines (LPG_PAYMENTS_PROVIDER,
      LPG_RAZORPAY_KEY_ID, _KEY_SECRET, _WEBHOOK_SECRET, LPG_PAYMENTS_ALLOW_TEST_KEYS).
      When set, the server writes them into integrations.env; when empty, the
      server's existing payment settings are left alone.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Run deploy-image.sh on the server
      shell: bash
      env:
        SHA: ${{ inputs.sha }}
        HOST: ${{ inputs.host }}
        SSH_KEY: ${{ inputs.ssh-key }}
        HOST_KEY: ${{ inputs.host-key }}
        GHCR_USER: ${{ inputs.ghcr-user }}
        GHCR_TOKEN: ${{ inputs.ghcr-token }}
        FCM_SERVICE_ACCOUNT: ${{ inputs.fcm-service-account }}
        STORAGE_ENV: ${{ inputs.storage-env }}
        PAYMENTS_ENV: ${{ inputs.payments-env }}
      run: |
        set -euo pipefail
        install -m 700 -d ~/.ssh
        printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
        chmod 600 ~/.ssh/deploy_key
        # Pinned host key: refuse to talk to anything that is not our server.
        printf '%s\n' "$HOST_KEY" > ~/.ssh/known_hosts
        # stdin: line 1 = registry token, line 2 = base64 service-account JSON
        # (empty = leave push settings alone), line 3 = base64 storage KEY=VALUE lines
        # (empty = leave storage settings alone). Never on the command line.
        fcm_b64=""
        if [ -n "$FCM_SERVICE_ACCOUNT" ]; then
          fcm_b64="$(printf '%s' "$FCM_SERVICE_ACCOUNT" | base64 -w0)"
        fi
        storage_b64=""
        if [ -n "$STORAGE_ENV" ]; then
          storage_b64="$(printf '%s\n' "$STORAGE_ENV" | base64 -w0)"
        fi
        payments_b64=""
        if [ -n "$PAYMENTS_ENV" ]; then
          payments_b64="$(printf '%s\n' "$PAYMENTS_ENV" | base64 -w0)"
        fi
        printf '%s\n%s\n%s\n%s\n' "$GHCR_TOKEN" "$fcm_b64" "$storage_b64" "$payments_b64" | ssh \
          -i ~/.ssh/deploy_key \
          -o BatchMode=yes \
          -o StrictHostKeyChecking=yes \
          -o ConnectTimeout=20 \
          -o ServerAliveInterval=30 \
          "root@${HOST}" "deploy ${SHA} ${GHCR_USER}"
