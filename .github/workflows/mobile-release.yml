name: Mobile release

# Builds signed Android App Bundles (.aab) for the Customer and Driver apps,
# ready to upload to the Play Console. Run it from Actions -> Mobile release ->
# Run workflow, or push a tag like `mobile-v1.0.0`. Setup: mobile/RELEASE.md.
#
# Secrets and variables live on the "production" environment:
#   ANDROID_KEYSTORE_BASE64   upload keystore (.jks), base64-encoded
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD
#   LOCATIONIQ_API_KEY        maps and geocoding (optional; maps degrade without it)
#   vars.MOBILE_API_BASE_URL  backend origin (defaults to https://lpg.vitessetec.com)
#
# The version name comes from each app's pubspec.yaml; the build number is the
# workflow run number, so every upload is accepted as newer than the last.

on:
  workflow_dispatch:
  push:
    tags: ['mobile-v*']

concurrency:
  group: mobile-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  android:
    name: Android bundle - ${{ matrix.app }}
    runs-on: ubuntu-latest
    environment: production
    strategy:
      fail-fast: false
      matrix:
        app: [customer_app, driver_app]
    defaults:
      run:
        working-directory: mobile/apps/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install the upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::ANDROID_${name} is not set on the production environment (see mobile/RELEASE.md)"
              exit 1
            fi
          done
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
          {
            echo "storeFile=upload-keystore.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties

      - run: flutter pub get

      - name: Build app bundle
        env:
          API_BASE_URL: ${{ vars.MOBILE_API_BASE_URL || 'https://lpg.vitessetec.com' }}
          LOCATIONIQ_API_KEY: ${{ secrets.LOCATIONIQ_API_KEY }}
        run: |
          flutter build appbundle --release \
            --build-number=${{ github.run_number }} \
            --dart-define=API_BASE_URL="$API_BASE_URL" \
            --dart-define=LOCATIONIQ_API_KEY="$LOCATIONIQ_API_KEY"

      - name: Remove the keystore
        if: always()
        run: rm -f android/app/upload-keystore.jks android/key.properties

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-release-aab
          path: mobile/apps/${{ matrix.app }}/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30
