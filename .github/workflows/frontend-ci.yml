name: Frontend CI

on:
  pull_request:
    paths:
      - 'frontend/**'
      - 'design-tokens/**'
      - 'scripts/generate-tokens.mjs'
      - '.github/workflows/frontend-ci.yml'
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'design-tokens/**'
      - 'scripts/generate-tokens.mjs'
      - '.github/workflows/frontend-ci.yml'

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Nx affected-detection needs history

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      # Tokens are generated from a single source (docs/ui/09-design-tokens.md).
      # A hand-edited generated file would silently diverge from Flutter's copy,
      # and the symptom is a mobile screen that is subtly the wrong colour.
      - name: Design tokens are up to date
        run: node scripts/generate-tokens.mjs --check

      - name: Format check
        run: npx prettier --check .
        working-directory: frontend

      # ADR-018: feature libraries may never import each other. Enforced here,
      # mirroring import-linter on the backend.
      - name: Lint and module boundaries
        run: npx nx run-many -t lint --all
        working-directory: frontend

      - name: Test
        run: npx nx run-many -t test --all
        working-directory: frontend

      - name: Build
        run: npx nx run-many -t build --all
        working-directory: frontend
