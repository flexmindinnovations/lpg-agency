name: Frontend CI

on:
  pull_request:
    paths:
      - 'frontend/**'
      - 'design-tokens/**'
      - 'scripts/generate-tokens.mjs'
      - '.github/workflows/frontend-ci.yml'
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'design-tokens/**'
      - 'scripts/generate-tokens.mjs'
      - '.github/workflows/frontend-ci.yml'

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Nx affected-detection needs history

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # @ngrx/signals@21 declares an Angular 21 peer range while the workspace is
      # on Angular 22, so plain `npm ci` fails with ERESOLVE.
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
        working-directory: frontend

      # app.config.ts imports the git-ignored prime-license.ts (a licence key that
      # is never committed); the committed template builds PrimeNG unlicensed.
      - name: Provide the PrimeNG licence template
        run: cp -n apps/dashboard/src/app/prime-license.example.ts apps/dashboard/src/app/prime-license.ts
        working-directory: frontend

      # The former "design tokens are up to date" step was removed 2026-09-25:
      # `tokens.css` has been hand-maintained since the dashboard theme moved to
      # solid surfaces (Phase 29), so regenerating from design-tokens/tokens.json
      # would overwrite the current design and the check could only ever fail.
      # `scripts/generate-tokens.mjs` is stale, not authoritative.

      - name: Format check
        run: npx prettier --check .
        working-directory: frontend

      # ADR-018: feature libraries may never import each other. Enforced here,
      # mirroring import-linter on the backend.
      - name: Lint and module boundaries
        run: npx nx run-many -t lint --all
        working-directory: frontend

      - name: Test
        run: npx nx run-many -t test --all
        working-directory: frontend

      - name: Build
        run: npx nx run-many -t build --all
        working-directory: frontend
