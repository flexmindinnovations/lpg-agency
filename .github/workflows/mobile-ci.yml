name: Mobile CI

on:
  pull_request:
    paths: ['mobile/**', 'design-tokens/**', '.github/workflows/mobile-ci.yml']
  push:
    branches: [main]
    paths: ['mobile/**', 'design-tokens/**', '.github/workflows/mobile-ci.yml']

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest

    strategy:
      # fail-fast off: when several packages break, seeing all of them in one
      # run is worth more than finishing thirty seconds sooner.
      fail-fast: false
      matrix:
        package:
          - mobile/packages/api_client
          - mobile/packages/auth
          - mobile/packages/core
          - mobile/packages/design_system
          - mobile/packages/local_storage
          - mobile/packages/realtime
          - mobile/packages/sync_engine
          - mobile/apps/admin_app
          - mobile/apps/customer_app
          - mobile/apps/driver_app

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get
        working-directory: ${{ matrix.package }}

      - name: Format check
        run: dart format --set-exit-if-changed .
        working-directory: ${{ matrix.package }}

      - name: Analyze
        run: flutter analyze
        working-directory: ${{ matrix.package }}

      - name: Test
        run: flutter test
        working-directory: ${{ matrix.package }}

  # Story 2.1: string catalogues and the hardcoded-string lint. Separate from
  # the package matrix because it looks across packages and apps.
  i18n:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generated catalogues match their JSON, and no translation has stray keys
        run: mobile/tools/check_catalogues.sh

      - name: Install lint dependencies
        run: dart pub get
        working-directory: mobile/tools/i18n_lint

      - name: Format check (lint tool)
        run: dart format --set-exit-if-changed .
        working-directory: mobile/tools/i18n_lint

      - name: Analyze (lint tool)
        run: dart analyze
        working-directory: mobile/tools/i18n_lint

      - name: Test (lint tool)
        run: dart test
        working-directory: mobile/tools/i18n_lint

      - name: No new hardcoded user-visible strings
        run: dart run bin/check.dart --root ../..
        working-directory: mobile/tools/i18n_lint
