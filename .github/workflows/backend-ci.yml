name: Backend CI

# Path-filtered so a Flutter-only change never rebuilds the backend
# (docs/architecture/13-deployment.md §5).
on:
  pull_request:
    paths: ['backend/**', '.github/workflows/backend-ci.yml']
  push:
    branches: [main]
    paths: ['backend/**', '.github/workflows/backend-ci.yml']

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      # Integration tests run against a real PostgreSQL, never SQLite or a
      # mock — RLS policies and PostgreSQL-specific types must actually be
      # exercised (docs/implementation/testing-strategy.md).
      #
      # The services listen on the same host ports as the local docker compose
      # stack (5433 / 56379 / 59000) and use its dev credentials, because
      # that is where the integration tests look by default
      # (`tests/conftest.py`, and the many suites that seed through the
      # `lpg_admin` role). Without this every integration test skipped
      # silently ("PostgreSQL is not reachable") and CI proved only the unit
      # tests.
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: lpg_admin
          POSTGRES_PASSWORD: dev_only_not_a_real_secret
          POSTGRES_DB: lpg_test
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U lpg_admin -d lpg_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['56379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10

    env:
      LPG_DATABASE_URL: postgresql+asyncpg://lpg_admin:dev_only_not_a_real_secret@localhost:5433/lpg_test
      LPG_REDIS_URL: redis://localhost:56379/1

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --python 3.13

      # The integration tests need the schema, the non-superuser `lpg_app`
      # role (RLS only holds for a role that cannot bypass it) and object
      # storage. The role and extensions come from the same init script the
      # local docker compose database runs, so CI and a developer's machine
      # cannot drift apart.
      - name: Prepare the database (roles, extensions, migrations)
        env:
          PGPASSWORD: dev_only_not_a_real_secret
        run: |
          psql -h localhost -p 5433 -U lpg_admin -d postgres -c "CREATE DATABASE lpg_dev"
          psql -h localhost -p 5433 -U lpg_admin -d postgres -v ON_ERROR_STOP=1 \
            -f ../infrastructure/docker/postgres/init/01-init.sql
          uv run alembic upgrade head

      - name: Start object storage (MinIO)
        run: |
          docker compose -f ../infrastructure/docker/docker-compose.yml up -d minio
          for i in $(seq 1 30); do
            curl -fsS http://localhost:59000/minio/health/live && exit 0
            sleep 2
          done
          echo "MinIO did not become healthy" >&2
          docker compose -f ../infrastructure/docker/docker-compose.yml logs minio
          exit 1

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Format check (ruff)
        run: uv run ruff format --check .

      - name: Type check (mypy --strict)
        run: uv run mypy

      # ADR-024: the Clean Architecture dependency rule is a merge-blocking
      # check, not a convention. This replaces what NetArchTest would have
      # provided in the superseded .NET design.
      - name: Architecture boundaries (import-linter)
        run: uv run lint-imports

      # ADR-026: the committed OpenAPI spec is the client contract. If it can
      # drift from the implementation, it is not a contract.
      - name: OpenAPI contract drift
        run: uv run python scripts/export_openapi.py --check

      # Integration tests are real now: if PostgreSQL, Redis or MinIO is
      # unreachable they skip, so a skip count in this log is a red flag.
      - name: Tests
        run: uv run pytest -q -rs
