name: Repository CI

# Repository-wide checks that belong to no single stack.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: repo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: No committed environment files
        run: |
          # .env is git-ignored, but `git add --force` bypasses that.
          # Cheap to check here; expensive to discover the other way.
          if git ls-files | grep -E '(^|/)\.env$|\.env\.(local|production|staging)$'; then
            echo "::error::An environment file is committed. Remove it and rotate anything it contained."
            exit 1
          fi
          echo "No environment files committed."

      - name: Superseded architecture stays superseded
        run: |
          # Phase 0 superseded the .NET architecture but preserved it for
          # traceability. A document instructing an agent to build with .NET
          # must never reappear outside docs/architecture/superseded/.
          matches=$(git ls-files 'docs/architecture/*.md' \
            | grep -v 'superseded/' \
            | xargs grep -lE 'ASP\.NET Core [0-9]|EF Core DbContext|MediatR IPipelineBehavior' 2>/dev/null || true)
          if [ -n "$matches" ]; then
            echo "::error::A superseded .NET instruction appeared on an active documentation path:"
            echo "$matches"
            exit 1
          fi
          echo "Active architecture documentation is consistent."

      - name: Alembic is the sole owner of schema
        run: |
          # ADR-027: the database is hosted on Supabase, but Supabase's own
          # migration system must never be used. Two migration systems on one
          # database produce a schema neither can reliably describe, and the
          # damage surfaces as a failed deploy in an environment nobody was
          # watching. Cheap to prevent; expensive to unpick.
          if [ -d supabase/migrations ] || git ls-files | grep -q '^supabase/migrations/'; then
            echo "::error::supabase/migrations/ exists. Alembic owns the schema (ADR-027)."
            echo "Move any schema change into backend/migrations/ as an Alembic revision."
            exit 1
          fi
          echo "Alembic remains the sole migration system."

      - name: No Supabase service_role key committed
        run: |
          # service_role bypasses Row-Level Security by design, which removes
          # the tenant-isolation backstop entirely (ADR-017, ADR-027).
          # A leaked service_role key is a full cross-tenant data breach.
          if git ls-files -z | xargs -0 grep -lE 'service_role.*ey[A-Za-z0-9_-]{20,}|SUPABASE_SERVICE_ROLE_KEY=[A-Za-z0-9]' 2>/dev/null; then
            echo "::error::A Supabase service_role key appears to be committed. Remove it and rotate it immediately."
            exit 1
          fi
          echo "No service_role key committed."

      - name: Planning system is present
        run: |
          test -f planning/current_phase.md \
            || { echo "::error::planning/current_phase.md is missing"; exit 1; }
          echo "Planning system present."
