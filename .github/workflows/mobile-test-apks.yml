name: Mobile test APKs

# Builds release-mode Android APKs, signed with the shared internal-test key
# (mobile/signing/README.md, so a phone keeps its identity across builds), for the Customer, Driver and Admin apps
# against production, with the dev OTP banner enabled, for internal testing.
# Run from Actions -> Mobile test APKs -> Run workflow. Download the APKs from
# the run's artifacts, or straight from the `test-apks` pre-release (the
# release job below), which holds the plain .apk files of the latest run.
# Not for the Play Store (see mobile-release.yml).

on:
  workflow_dispatch:
  push:
    branches: ['claude/project-thread-i46tz0']
    paths: ['.github/workflows/mobile-test-apks.yml']

permissions:
  contents: read

jobs:
  apk:
    name: APK - ${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [customer_app, driver_app, admin_app]
    defaults:
      run:
        working-directory: mobile/apps/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build APK
        run: |
          flutter build apk --release \
            --dart-define=API_BASE_URL=https://lpg.vitessetec.com \
            --dart-define=SHOW_DEV_OTP=true
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-release-apk
          path: mobile/apps/${{ matrix.app }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish APKs to the test-apks pre-release
    needs: apk
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: apks
      - name: Rename APKs
        run: |
          mkdir out
          for app in customer driver admin; do
            cp "apks/${app}_app-release-apk/app-release.apk" "out/${app}-app.apk"
          done
          ls -l out
      - name: Publish pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          notes="Test APKs built from ${GITHUB_SHA} (run ${GITHUB_RUN_ID}). Production API, dev OTP shown, internal test key. Not for the Play Store."
          if gh release view test-apks >/dev/null 2>&1; then
            gh release edit test-apks --prerelease --target "${GITHUB_SHA}" --notes "$notes"
          else
            gh release create test-apks --prerelease --target "${GITHUB_SHA}" \
              --title "Test APKs (latest)" --notes "$notes"
          fi
          gh release upload test-apks out/*.apk --clobber
