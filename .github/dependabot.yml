version: 2
updates:
  # Base images are pinned by digest in the Dockerfiles; this is how they move.
  # Node moves only within its current major (24 is the LTS in use); a new Node
  # major is a deliberate upgrade, not a bot PR.
  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
  - package-ecosystem: docker
    directory: /frontend
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    ignore:
      - dependency-name: node
        update-types: ["version-update:semver-major"]
  # One PR for all workflow action updates. Every merge to main deploys, so
  # review it once a month rather than as a stream.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
