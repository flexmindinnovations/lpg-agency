name: design_system
description: Design tokens, theming, icons, motion and shared widgets for the LPG mobile apps, generated from the shared token source.
version: 0.2.0
publish_to: none

environment:
  sdk: ^3.12.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  # Built-in widget text (date pickers, dialogs, back button) per language.
  flutter_localizations:
    sdk: flutter
  # The one icon set both apps draw from, always through `LpgIcons` so a
  # future swap is a one-file change. Regular weight for idle states, Fill
  # for selected ones.
  lucide_icons_flutter: ^4.0.0
  # Draws the illustration files in `assets/illustrations/`. Pictures live as
  # SVG files, never as path data in Dart.
  flutter_svg: ^2.3.0
  intl: ^0.20.2
  # `ErrorKind` and the error classification the friendly messages hang on.
  core:
    path: ../core
  # `AsyncValue` (the async view helpers) and `Notifier` (the runtime language):
  # the pure-Dart package, no Flutter binding. Apps already depend on
  # flutter_riverpod 3.
  riverpod: ^3.0.0
  # Typed JSON string catalogues (story 0.2). Runtime part only; the
  # generator is run with `dart run slang`, no build_runner involved.
  slang: ^4.19.2
  slang_flutter: ^4.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  # Illustrations are plain SVG files drawn in four placeholder greys that
  # `LpgIllustrationArt` swaps for the tile's tone at render time (see
  # assets/illustrations/README.md).
  assets:
    - assets/illustrations/
    # The grain tile behind every page (tool/make_paper_grain.py makes it).
    - assets/textures/
  # Inter is bundled rather than fetched at runtime: no network request on
  # first launch, and identical metrics on every device. Apps reference it
  # through `LpgTheme`, which sets `fontFamily: 'packages/design_system/Inter'`.
  # Licence: fonts/inter/OFL.txt (SIL Open Font License 1.1).
  fonts:
    - family: Inter
      fonts:
        - asset: fonts/inter/Inter-Regular.ttf
          weight: 400
        - asset: fonts/inter/Inter-Medium.ttf
          weight: 500
        - asset: fonts/inter/Inter-SemiBold.ttf
          weight: 600
        - asset: fonts/inter/Inter-Bold.ttf
          weight: 700
        - asset: fonts/inter/Inter-ExtraBold.ttf
          weight: 800
