name: device_identity
description: >-
  Who this phone is, to the agency: a random install ID kept in secure
  storage, the phone's details, the headers every request carries, and the
  "waiting for approval" / "blocked" states the Driver and Admin apps handle
  (ADR-071).
version: 0.0.1
publish_to: 'none'

environment:
  sdk: ^3.12.2
  flutter: ">=3.38.1"

dependencies:
  flutter:
    sdk: flutter
  flutter_secure_storage: ^11.0.0
  # Phone model, manufacturer and OS version.
  device_info_plus: ^13.3.0
  # The app's own version.
  package_info_plus: ^10.2.2
  # The Android ID (device_info_plus does not expose it: its `id` is the
  # build number).
  android_id: ^0.5.2
  dio: ^5.9.0
  core:
    path: ../core
  api_client:
    path: ../api_client
  design_system:
    path: ../design_system

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
