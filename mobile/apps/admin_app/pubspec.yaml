name: admin_app
description: "LPG Agency Admin and Manager Mobile Application."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.0.0
  go_router: ^17.0.0
  design_system:
    path: ../../packages/design_system
  core:
    path: ../../packages/core
  api_client:
    path: ../../packages/api_client
  auth:
    path: ../../packages/auth
  local_storage:
    path: ../../packages/local_storage
  sync_engine:
    path: ../../packages/sync_engine
  realtime:
    path: ../../packages/realtime
  maps:
    path: ../../packages/maps

  cupertino_icons: ^1.0.8
  intl: ^0.20.3
  image_picker: ^1.2.3
  signature: ^6.4.0

  firebase_core: ^3.8.0
  firebase_messaging: ^15.1.5
  flutter_local_notifications: ^18.0.1
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  geolocator: ^14.0.3
  url_launcher: ^6.3.2
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/launcher_icon.jpg"

flutter:
  uses-material-design: true
  assets:
    - assets/images/lpg_app_logo.jpg
