org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
# Kotlin's incremental compiler hits a "could not close incremental caches"
# crash in a plugin's compileDebugKotlin on this machine -- survives
# `flutter clean`. Same root cause and workaround as the customer app: the
# incremental cache's relative-path bookkeeping chokes on the project
# (E:\...) and the pub-cache dependency sources (C:\...) being on different
# drive letters, worsened by parallel execution. Debug build speed is the
# only cost.
org.gradle.parallel=false
kotlin.incremental=false
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
