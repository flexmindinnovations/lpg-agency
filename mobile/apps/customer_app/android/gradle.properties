org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
# Kotlin's incremental compiler hits a "storage already registered" /
# "different roots" crash in image_picker_android's compileDebugKotlin on
# this machine -- reproduced twice, survives `flutter clean`. Root cause
# looks like the incremental cache's relative-path bookkeeping choking on
# the project (E:\...) and Gradle/Kotlin's pub-cache dependency sources
# (C:\...) living on different drive letters, worsened by parallel
# execution racing the same module's cache files. Disabling both is the
# standard workaround; debug build speed is the only cost.
org.gradle.parallel=false
kotlin.incremental=false
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
