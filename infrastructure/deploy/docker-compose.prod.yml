# Single-host production stack (DigitalOcean Droplet).
#
#   cd /opt/lpg-agency/infrastructure/deploy
#   ./generate-env.sh          # once: writes .env with fresh secrets
#   ./deploy.sh                # manual: build on this server, migrate, (re)start
#
# Images are named ghcr.io/<owner>/lpg-{backend,web}:${IMAGE_TAG}. CI builds and
# pushes them, then runs ./deploy-image.sh <git-sha>, which sets IMAGE_TAG in
# .env and pulls. With no IMAGE_TAG the tag is "local", i.e. built on this host.
#
# Only Caddy publishes ports (80/443). Postgres and Redis are reachable
# on the internal compose network only. Secrets come from ./.env (git-ignored).

name: lpg-agency

x-backend-env: &backend-env
  LPG_ENVIRONMENT: production
  LPG_DEBUG: "false"
  LPG_DOCS_ENABLED: "false"
  LPG_LOG_LEVEL: INFO
  LPG_LOG_JSON: "true"
  LPG_CORS_ORIGINS: ${PUBLIC_ORIGIN}
  LPG_DB_HOST: postgres
  LPG_DB_PORT: "5432"
  LPG_DB_NAME: lpg
  LPG_DB_USER: lpg_app
  LPG_DB_PASSWORD: ${LPG_APP_DB_PASSWORD}
  LPG_REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
  # S3-compatible object storage (e.g. DigitalOcean Spaces) - set in .env.
  # Left empty, the backend still boots but /health/ready reports storage down.
  LPG_STORAGE_ENDPOINT_URL: ${LPG_STORAGE_ENDPOINT_URL:-}
  LPG_STORAGE_ACCESS_KEY: ${LPG_STORAGE_ACCESS_KEY:-}
  LPG_STORAGE_SECRET_KEY: ${LPG_STORAGE_SECRET_KEY:-}
  LPG_STORAGE_BUCKET: ${LPG_STORAGE_BUCKET:-}
  LPG_STORAGE_REGION: ${LPG_STORAGE_REGION:-}
  LPG_JWT_PRIVATE_KEY: ${LPG_JWT_PRIVATE_KEY}
  LPG_JWT_PUBLIC_KEY: ${LPG_JWT_PUBLIC_KEY}
  LPG_KYC_ENCRYPTION_KEY: ${LPG_KYC_ENCRYPTION_KEY}

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: lpg_admin
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD}
      POSTGRES_DB: lpg
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
      LPG_APP_DB_PASSWORD: ${LPG_APP_DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    # Sized for a 2 GB host shared with the app containers.
    command: ["postgres", "-c", "max_connections=60", "-c", "shared_buffers=128MB", "-c", "effective_cache_size=512MB"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lpg_admin -d lpg"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes", "--maxmemory", "128mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 12
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  # One-shot: applies Alembic migrations as the elevated role, then exits.
  migrate:
    image: ${BACKEND_IMAGE:-ghcr.io/flexmindinnovations/lpg-backend}:${IMAGE_TAG:-local}
    pull_policy: never
    restart: "no"
    command: ["alembic", "upgrade", "head"]
    environment:
      LPG_MIGRATION_DATABASE_URL: postgresql+asyncpg://lpg_admin:${POSTGRES_ADMIN_PASSWORD}@postgres:5432/lpg
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    image: ${BACKEND_IMAGE:-ghcr.io/flexmindinnovations/lpg-backend}:${IMAGE_TAG:-local}
    restart: unless-stopped
    environment:
      <<: *backend-env
      # 1 vCPU / 2 GB host: gunicorn's default (2*cores+1) would be too many.
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  # arq background jobs + cron (compliance expiry, stale-order alerts, ...).
  worker:
    image: ${BACKEND_IMAGE:-ghcr.io/flexmindinnovations/lpg-backend}:${IMAGE_TAG:-local}
    pull_policy: never
    restart: unless-stopped
    command: ["arq", "lpg.infrastructure.jobs.worker.WorkerSettings"]
    environment: *backend-env
    depends_on:
      backend:
        condition: service_healthy

  web:
    build:
      context: ../../frontend
      dockerfile: Dockerfile
    image: ${WEB_IMAGE:-ghcr.io/flexmindinnovations/lpg-web}:${IMAGE_TAG:-local}
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      # ":80" = plain HTTP on the raw IP. Set to a domain name to get automatic
      # HTTPS from Let's Encrypt (see docs: infrastructure/deploy/DEPLOY.md).
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres-data:
  redis-data:
  caddy-data:
  caddy-config:
