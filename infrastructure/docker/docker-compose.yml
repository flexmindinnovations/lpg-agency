# Local development environment — PostgreSQL + Redis
#
# Development only. Production infrastructure is a later phase, and the Azure
# hosting topology is deliberately undecided (ADR-022).
#
#   Start:  docker compose -f infrastructure/docker/docker-compose.yml up -d
#   Stop:   docker compose -f infrastructure/docker/docker-compose.yml down
#   Reset:  docker compose -f infrastructure/docker/docker-compose.yml down -v
#
# Ports are deliberately non-default (55432 / 56379) so this stack does not
# collide with any PostgreSQL or Redis already running on the developer's
# machine — a common and confusing failure mode.

name: lpg-agency-dev

services:
  postgres:
    image: postgres:17-alpine
    container_name: lpg-postgres
    restart: unless-stopped
    environment:
      # Superuser — used for migrations and administration only.
      # The application connects as a separate, non-superuser role created in
      # init/01-init.sql, because an application role holding BYPASSRLS would
      # silently defeat tenant isolation (ADR-017, 06-database-architecture.md §2.2).
      #
      # Database and role names are fixed rather than configurable: the init
      # SQL runs through psql, which does not expand environment variables, so
      # a configurable name here would drift from what the init script creates.
      # Only the host port is parameterized, since that is the value developers
      # actually need to change.
      POSTGRES_USER: lpg_admin
      POSTGRES_PASSWORD: dev_only_not_a_real_secret
      POSTGRES_DB: lpg_dev
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "${POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lpg_admin -d lpg_dev"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    command:
      - postgres
      # Verbose enough to catch N+1 patterns and slow queries during development.
      # Not a production configuration.
      - -c
      - log_statement=none
      - -c
      - log_min_duration_statement=200
      - -c
      - max_connections=100

  redis:
    image: redis:7-alpine
    container_name: lpg-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-56379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --save
      - "60"
      - "1"

volumes:
  postgres-data:
    name: lpg-postgres-data
  redis-data:
    name: lpg-redis-data
