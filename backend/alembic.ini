[alembic]
script_location = migrations
prepend_sys_path = src
path_separator = os

# The database URL is NOT set here. It is read from LPG_DATABASE_URL by
# migrations/env.py, so a connection string never sits in source control and
# the same config works across every environment.
sqlalchemy.url =

# Migrations run as the *superuser* role, not the application role. The
# application role is deliberately NOSUPERUSER / NOBYPASSRLS so that PostgreSQL
# Row-Level Security remains an effective tenant-isolation backstop
# (ADR-017, 06-database-architecture.md §2.2, §10).

[post_write_hooks]
hooks = ruff_format
ruff_format.type = console_scripts
ruff_format.entrypoint = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
