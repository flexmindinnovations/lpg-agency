[project]
name = "lpg-backend"
version = "0.1.0"
description = "LPG Agency Management Platform — backend API"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "Proprietary" }

dependencies = [
    # Web framework and validation
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    # Persistence
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    # Cache / queue / real-time backplane
    "redis>=5.2.0",
    # Background jobs (ADR-029) — async-native, Redis-backed, no second broker
    "arq>=0.26.0",
    # Object storage (D-40) — S3-compatible client, async-native to match the
    # rest of the stack. MinIO locally/UAT; production vendor deferred with
    # hosting topology (ADR-022, Phase 3 ADR).
    "aioboto3>=13.2.0",
    # Observability
    "structlog>=24.4.0",
]

[dependency-groups]
dev = [
    # Testing
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.28.0",
    # Quality — Ruff replaces flake8 + black + isort, keeping the toolchain small
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "import-linter>=2.1",
    # Type stubs for aioboto3's S3 client (mypy --strict, ADR-024) — dev-only,
    # no runtime effect.
    "types-aiobotocore[s3]",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lpg"]

# ==========================================================================
# Ruff — linting and formatting
# ==========================================================================
[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "ARG",  # unused arguments
    "SIM",  # flake8-simplify
    "TCH",  # type-checking imports
    "PTH",  # prefer pathlib
    "RUF",  # ruff-specific
    "ASYNC",# flake8-async — catches blocking calls in async paths
    "S",    # bandit security checks
    "BLE",  # blind except — allowed only where a probe must never raise
]
ignore = [
    "S101",  # assert — pytest uses it
    "B008",  # function call in default argument — this is FastAPI's Depends() idiom
]

[tool.ruff.lint.per-file-ignores]
# Fixtures, fake credentials, and generated temp-table names interpolated into
# DDL. S608 is exempted for tests only: the interpolated value is always a
# uuid4 hex generated in the test, never user input. Application code keeps the
# rule.
"tests/**/*.py" = ["ARG001", "S105", "S106", "S608"]
# Migrations interpolate module-level schema/table name constants into DDL —
# never user input, and Alembic's own generated revision IDs/messages are not
# request-controlled either. Application code keeps the rule.
"migrations/versions/*.py" = ["S608"]

[tool.ruff.lint.isort]
known-first-party = ["lpg"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ==========================================================================
# mypy — strict. Python has no compile-time layer enforcement, so this is
# load-bearing infrastructure rather than a style preference (ADR-024).
# ==========================================================================
[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
warn_no_return = true
show_error_codes = true
pretty = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

[[tool.mypy.overrides]]
# aioboto3 itself ships no py.typed marker / stubs (unlike aiobotocore,
# covered by the types-aiobotocore[s3] dev dependency, which is what types
# every S3Client call this codebase actually makes). Narrowly scoped to
# this one genuinely-unstubbed third-party import, not a blanket relaxation.
module = ["aioboto3", "aioboto3.*"]
ignore_missing_imports = true

# ==========================================================================
# pytest
# ==========================================================================
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = [
    "--strict-markers",
    "--strict-config",
    "-ra",
]
markers = [
    "integration: requires PostgreSQL and Redis from docker compose",
]

[tool.coverage.run]
source = ["src/lpg"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

# ==========================================================================
# import-linter — Clean Architecture boundary enforcement (ADR-024).
#
# This is the replacement for what NetArchTest would have provided in the
# superseded .NET design. The dependency rule is not a convention here; it is
# a merge-blocking CI check.
# ==========================================================================
[tool.importlinter]
root_package = "lpg"
# Required because several contracts forbid *external* packages
# (fastapi, sqlalchemy) rather than only internal modules.
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Clean Architecture layers point inward only"
type = "layers"
layers = [
    "lpg.api",
    "lpg.application",
    "lpg.domain",
]
exhaustive = false

[[tool.importlinter.contracts]]
name = "Domain is framework-free"
type = "forbidden"
source_modules = ["lpg.domain"]
forbidden_modules = [
    "fastapi",
    "sqlalchemy",
    "alembic",
    "redis",
    "starlette",
    "lpg.infrastructure",
    "lpg.api",
    "lpg.application",
]

[[tool.importlinter.contracts]]
name = "Application depends on domain only, never infrastructure or api"
type = "forbidden"
source_modules = ["lpg.application"]
forbidden_modules = [
    "fastapi",
    "sqlalchemy",
    "redis",
    "lpg.infrastructure",
    "lpg.api",
]

[[tool.importlinter.contracts]]
name = "SQLAlchemy stays inside infrastructure"
type = "forbidden"
source_modules = ["lpg.domain", "lpg.application", "lpg.api"]
forbidden_modules = ["sqlalchemy", "asyncpg"]
# The composition root is the one module that legitimately knows every layer —
# that is what a composition root is for. Every other module in lpg.api reaches
# infrastructure only through application-layer ports.
ignore_imports = [
    "lpg.api.app -> lpg.infrastructure.persistence.database",
    "lpg.api.app -> lpg.infrastructure.redis.client",
    "lpg.api.app -> lpg.infrastructure.health",
    "lpg.api.app -> lpg.infrastructure.realtime.publisher",
    "lpg.api.app -> lpg.infrastructure.storage.client",
    # Dependency-wiring modules under api/v1/dependencies/ are the other
    # place the API layer is allowed to know concrete infrastructure types
    # exist — exactly the composition root's role, scoped to one seam each,
    # so that routers and use cases never import infrastructure directly.
    "lpg.api.v1.dependencies.unit_of_work -> lpg.infrastructure.persistence.unit_of_work",
]

[[tool.importlinter.contracts]]
name = "FastAPI stays inside the api layer"
type = "forbidden"
source_modules = ["lpg.domain", "lpg.application", "lpg.infrastructure"]
forbidden_modules = ["fastapi", "starlette"]
