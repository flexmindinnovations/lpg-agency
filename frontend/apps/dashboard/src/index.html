<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>LPG Agency Dashboard</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="LPG Agency Management Platform — manage customers, deliveries, inventory and operations."
    />
    <!-- The paper grain tile is on first paint of the page and every glass surface. -->
    <link rel="icon" type="image/png" href="favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      /* Boot loader: plain inline CSS so it paints before any bundle loads.
         It sits beside <lpg-root> and main.ts fades it out once the app has
         rendered its first route and is idle (and it has shown for a moment).
         Colours mirror the theme tokens (page base + brand blue/orange). */
      .boot {
        --boot-bg: #e9edf2;
        --boot-fg: #111827;
        --boot-muted: #374151;
        --boot-track: rgba(17, 24, 39, 0.1);
        --boot-brand: #162b66;
        position: fixed;
        inset: 0;
        z-index: 2147483000;
        transition: opacity 0.3s ease;
        display: grid;
        place-content: center;
        justify-items: center;
        gap: 20px;
        background:
          radial-gradient(circle min(110vw, 110vh) at 0 0, rgba(22, 43, 102, 0.09), transparent),
          radial-gradient(
            circle min(90vw, 90vh) at 100% 100%,
            rgba(232, 89, 12, 0.08),
            transparent
          ),
          var(--boot-bg);
        color: var(--boot-fg);
        font:
          500 14px/1.4 Inter,
          system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          sans-serif;
        text-align: center;
      }
      @media (prefers-color-scheme: dark) {
        html:not([data-theme='light']):not([data-theme='high-contrast']) .boot {
          --boot-bg: #0b1118;
          --boot-fg: #e2e7ec;
          --boot-muted: #a3b1c0;
          --boot-track: rgba(255, 255, 255, 0.12);
          --boot-brand: #4f8df7;
        }
      }
      html[data-theme='dark'] .boot {
        --boot-bg: #0b1118;
        --boot-fg: #e2e7ec;
        --boot-muted: #a3b1c0;
        --boot-track: rgba(255, 255, 255, 0.12);
        --boot-brand: #4f8df7;
      }
      html[data-theme='high-contrast'] .boot {
        --boot-bg: #ffffff;
        --boot-fg: #000000;
        --boot-muted: #000000;
        --boot-track: #000000;
        --boot-brand: #0000ee;
        background: #ffffff;
      }
      .boot--leaving {
        opacity: 0;
        pointer-events: none;
      }
      /* A gas burner lighting: a spark, a blue crown, then the flame grows and
         keeps flickering. Each part is its own layer animated with transform
         and opacity only, so the browser runs it off the main thread and it
         stays smooth while the app bundle is still parsing. Every layer's
         resting style is the lit burner, so reduced motion shows that. */
      .boot__mark {
        position: relative;
        inline-size: 96px;
        block-size: 96px;
      }
      .boot__mark::before {
        content: '';
        position: absolute;
        inset: -10px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(255, 140, 40, 0.38), transparent 68%);
        will-change: opacity;
        animation:
          boot-fade-in 1s ease-out 0.6s both,
          boot-breathe 2.6s ease-in-out 1.6s infinite alternate;
      }
      .boot__layer {
        position: absolute;
        inset: 0;
        inline-size: 96px;
        block-size: 96px;
        overflow: visible;
        /* The burner head sits at 70/96 of the height: flames grow from there. */
        transform-origin: 50% 73%;
        will-change: transform, opacity;
      }
      .boot__burner {
        fill: var(--boot-fg);
        opacity: 0.78;
      }
      .boot__spark {
        opacity: 0;
        transform-origin: 30% 68%;
        stroke: #ffc233;
        stroke-width: 2;
        stroke-linecap: round;
        animation: boot-spark 0.7s linear both;
      }
      .boot__crown {
        animation: boot-crown 0.5s ease-out 0.35s both;
      }
      .boot__ignite {
        animation: boot-ignite 1s cubic-bezier(0.2, 0.8, 0.3, 1) 0.55s both;
      }
      .boot__flicker {
        animation: boot-flicker 1.4s ease-in-out infinite alternate;
      }
      .boot__flicker--inner {
        animation-duration: 1.05s;
        animation-delay: -0.5s;
      }
      .boot__name {
        margin: 0;
        font-size: 18px;
        font-weight: 700;
        letter-spacing: 0.01em;
      }
      .boot__hint {
        margin: 2px 0 0;
        color: var(--boot-muted);
        font-size: 13px;
      }
      .boot__bar {
        position: relative;
        overflow: hidden;
        inline-size: 160px;
        block-size: 3px;
        border-radius: 3px;
        background: var(--boot-track);
      }
      .boot__bar::after {
        content: '';
        position: absolute;
        inset-block: 0;
        inline-size: 40%;
        border-radius: 3px;
        background: var(--boot-brand);
        animation: boot-slide 1.3s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      @keyframes boot-ignite {
        0% {
          transform: scale(0.1, 0);
          opacity: 0;
        }
        40% {
          transform: scale(0.6, 0.5);
          opacity: 1;
        }
        75% {
          transform: scale(1.08, 1.1);
        }
        100% {
          transform: scale(1, 1);
          opacity: 1;
        }
      }
      @keyframes boot-flicker {
        from {
          transform: scale(1, 1) skewX(0deg);
        }
        to {
          transform: scale(0.975, 1.035) skewX(0.8deg);
        }
      }
      @keyframes boot-crown {
        from {
          opacity: 0;
          transform: scaleY(0.2);
        }
        to {
          opacity: 1;
          transform: scaleY(1);
        }
      }
      @keyframes boot-spark {
        0% {
          opacity: 0;
          transform: scale(0.5);
        }
        25% {
          opacity: 1;
          transform: scale(1);
        }
        45% {
          opacity: 0;
        }
        60% {
          opacity: 1;
          transform: scale(1.15);
        }
        100% {
          opacity: 0;
        }
      }
      @keyframes boot-fade-in {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }
      @keyframes boot-breathe {
        from {
          opacity: 1;
        }
        to {
          opacity: 0.75;
        }
      }
      @keyframes boot-slide {
        0% {
          transform: translateX(-100%);
        }
        100% {
          transform: translateX(250%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot {
          transition: none;
        }
        .boot__mark::before,
        .boot__ignite,
        .boot__flicker,
        .boot__crown,
        .boot__spark,
        .boot__bar::after {
          animation: none;
        }
        .boot__layer {
          will-change: auto;
        }
        .boot__bar::after {
          inline-size: 100%;
          opacity: 0.5;
        }
      }
    </style>
    <script>
      // Same stored choice the app's theme service reads, applied before first
      // paint so the loader matches the theme (no light flash in dark mode).
      try {
        var t = localStorage.getItem('lpg.theme');
        // 'system' leaves it to prefers-color-scheme; no stored choice defaults
        // to dark, as the theme service does.
        if (t !== 'system') {
          document.documentElement.setAttribute(
            'data-theme',
            t === 'light' || t === 'high-contrast' ? t : 'dark',
          );
        }
        // Preload the paper grain for the theme that is about to paint (dark has
        // its own pre-inverted file), so it is on first paint, not a late pop-in.
        var dark =
          t === 'system'
            ? window.matchMedia('(prefers-color-scheme: dark)').matches
            : !(t === 'light' || t === 'high-contrast');
        var l = document.createElement('link');
        l.rel = 'preload';
        l.as = 'image';
        l.href = dark ? '/textures/paper-grain-dark.png' : '/textures/paper-grain.png';
        document.head.appendChild(l);
      } catch (e) {}
    </script>
  </head>
  <body>
    <lpg-root></lpg-root>
    <div class="boot" role="status" aria-live="polite" aria-label="Loading LPG Agency">
      <div class="boot__mark" aria-hidden="true">
        <svg class="boot__layer" viewBox="0 0 96 96" fill="none">
          <rect class="boot__burner" x="28" y="70" width="40" height="7" rx="3.5" />
          <rect class="boot__burner" x="42" y="77" width="12" height="8" />
          <rect class="boot__burner" x="33" y="85" width="30" height="4" rx="2" />
        </svg>
        <svg class="boot__layer boot__spark" viewBox="0 0 96 96" fill="none">
          <path d="M30 66 24 59M30 66 31 57M30 66 22 67" />
        </svg>
        <svg class="boot__layer boot__crown" viewBox="0 0 96 96" fill="#55b9ee">
          <path d="M33 70c-1.6-2.2-1.6-4.2 0-6.4 1.6 2.2 1.6 4.2 0 6.4Z" />
          <path d="M40.5 70c-1.6-2.6-1.6-5 0-7.6 1.6 2.6 1.6 5 0 7.6Z" />
          <path d="M48 70c-1.8-2.8-1.8-5.4 0-8.2 1.8 2.8 1.8 5.4 0 8.2Z" />
          <path d="M55.5 70c-1.6-2.6-1.6-5 0-7.6 1.6 2.6 1.6 5 0 7.6Z" />
          <path d="M63 70c-1.6-2.2-1.6-4.2 0-6.4 1.6 2.2 1.6 4.2 0 6.4Z" />
        </svg>
        <div class="boot__layer boot__ignite">
          <svg class="boot__layer boot__flicker" viewBox="0 0 96 96" fill="none">
            <path
              d="M48 12C50 27 65 35 65 52c0 10-7 18-17 18S31 62 31 52c0-8 5-14 9-20 1 6 3 8 6 9-1-10-1-19 2-29Z"
              fill="#e8590c"
            />
          </svg>
          <svg
            class="boot__layer boot__flicker boot__flicker--inner"
            viewBox="0 0 96 96"
            fill="none"
          >
            <path
              d="M48 32c1 10 10 14 10 26 0 7-4 12-10 12s-10-5-10-12c0-6 4-9 6-13 1 3 2 4 4 4-1-5-1-10 0-17Z"
              fill="#ffb347"
            />
            <path d="M48 53c4 4 6 8 6 12 0 3-2.7 5-6 5s-6-2-6-5c0-4 2-8 6-12Z" fill="#55b9ee" />
          </svg>
        </div>
      </div>
      <div>
        <p class="boot__name">LPG Agency</p>
        <p class="boot__hint">Loading your dashboard…</p>
      </div>
      <div class="boot__bar" aria-hidden="true"></div>
    </div>
  </body>
</html>
