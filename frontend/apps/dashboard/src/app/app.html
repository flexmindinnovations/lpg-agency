<!--
  Application shell.

  Landmarks (header / nav / main) and a skip link are present from the first
  commit rather than retrofitted: WCAG 2.2 AA is a Phase 1 requirement (D-35),
  and retrofitting document structure onto a built-out application is far more
  expensive than starting with it.
-->
<a class="skip-link" href="#main-content">Skip to main content</a>

<div class="shell">
  <header class="shell__top-bar">
    <div class="shell__brand">
      <span class="shell__brand-mark" aria-hidden="true">◆</span>
      <span class="shell__brand-name">LPG Agency</span>
    </div>

    <div class="shell__top-bar-actions">
      <label class="shell__theme-label" for="theme-select">Theme</label>
      <select
        id="theme-select"
        class="shell__theme-select"
        [value]="themePreference()"
        (change)="setTheme($any($event.target).value)"
      >
        @for (option of themeOptions(); track option) {
        <option [value]="option">{{ themeLabel(option) }}</option>
        }
      </select>
    </div>
  </header>

  <div class="shell__body">
    <nav class="shell__sidebar" aria-label="Main navigation">
      <ul class="shell__nav-list">
        <li>
          <a
            routerLink="/"
            routerLinkActive="is-active"
            [routerLinkActiveOptions]="{ exact: true }"
            class="shell__nav-link"
          >
            Home
          </a>
        </li>
      </ul>

      <p class="shell__nav-note">Navigation is populated as feature modules ship.</p>
    </nav>

    <main id="main-content" class="shell__main" tabindex="-1">
      <router-outlet />
    </main>
  </div>
</div>
