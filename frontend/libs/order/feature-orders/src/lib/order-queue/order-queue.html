<div class="order-queue">
  <div class="page-header">
    <ng-template lpgHeaderTitlePortal>
      <lpg-page-header
        title="Orders"
        [subtitle]="total() + ' order' + (total() === 1 ? '' : 's')"
      />
    </ng-template>
  </div>

  @if (errorMessage(); as msg) {
  <p-message severity="error">{{ msg }}</p-message>
  }

  <div class="data-toolbar">
    <div class="filters data-toolbar__filters">
      <div class="filters__field">
        <label for="status_filter">Status</label>
        <p-select
          id="status_filter"
          [options]="statusOptions"
          optionLabel="label"
          optionValue="value"
          placeholder="All statuses"
          [showClear]="true"
          [ngModel]="statusFilter()"
          (ngModelChange)="onStatusFilterChange($event)"
        ></p-select>
      </div>
    </div>
    <div class="data-toolbar__actions">
      <button *lpgHasPermission="'orders:create'" #createTriggerEl pButton type="button" (click)="openCreateDrawer()">
        <i pButtonIcon class="pi pi-plus"></i>
        <span pButtonLabel>New Booking</span>
      </button>
    </div>
  </div>

  <section class="grid-section">
    <lpg-data-grid
      [rows]="orders()"
      [columns]="orderColumns"
      [loading]="loading()"
      ariaLabel="Order queue"
    />
  </section>

  <!-- Create Order Drawer -->
  <p-drawer
    [(visible)]="showCreateDrawer"
    position="right"
    styleClass="!w-full md:!w-[30rem]"
    (onHide)="closeCreateDrawer(); createTrigger()?.nativeElement?.focus()"
  >
    <ng-template #header>
      <div class="drawer-header">
        <h2>Create Booking</h2>
        <p class="subtitle">Book a new cylinder delivery order</p>
      </div>
    </ng-template>

    <form [formGroup]="createForm" (ngSubmit)="onSubmitCreate()" class="dialog-form">
      <div class="dialog-form__fields">
      <lpg-form-field
        label="Customer"
        for="create_customer"
        [control]="createForm.controls.customer"
        [messages]="fieldMessages.customer"
      >
        <lpg-customer-autocomplete
          inputId="create_customer"
          formControlName="customer"
          placeholder="Search by name or phone..."
        ></lpg-customer-autocomplete>
      </lpg-form-field>

      @if (selectedCustomer(); as customer) {
      <lpg-form-field
        label="Delivery address"
        for="create_address"
        [control]="createForm.controls.address_id"
        [messages]="fieldMessages.address_id"
      >
        <p-select
          inputId="create_address"
          formControlName="address_id"
          [options]="customer.addresses"
          optionLabel="line_1"
          optionValue="id"
          placeholder="Select an address"
          (onChange)="onAddressChange($event.value)"
          [fluid]="true"
        ></p-select>
      </lpg-form-field>

      <lpg-form-field
        label="Booking source"
        for="create_booking_source"
        [control]="createForm.controls.booking_source"
        [messages]="fieldMessages.booking_source"
      >
        <p-select
          inputId="create_booking_source"
          formControlName="booking_source"
          [options]="bookingSourceOptions"
          optionLabel="label"
          optionValue="value"
          [fluid]="true"
        ></p-select>
      </lpg-form-field>

      <lpg-form-field
        label="Requested delivery date"
        for="create_requested_date"
        [control]="createForm.controls.requested_date"
        [messages]="fieldMessages.requested_date"
      >
        <p-datepicker
          inputId="create_requested_date"
          formControlName="requested_date"
          [showIcon]="true"
          [showTime]="true"
          iconDisplay="input"
          dateFormat="dd-mm-yy"
          appendTo="body"
          [fluid]="true"
        ></p-datepicker>
      </lpg-form-field>

      <div class="lines-header">
        <label>Cylinders</label>
        <button pButton type="button" text size="small" severity="secondary" (click)="addLine()">
          <i pButtonIcon class="pi pi-plus"></i>
          <span pButtonLabel>Add line</span>
        </button>
      </div>
      <div class="lines" formArrayName="lines">
        @for (line of lines.controls; track $index) {
        <div [formGroupName]="$index" class="line-row">
          <p-select
            formControlName="cylinder_type_id"
            [options]="cylinderTypes()"
            optionLabel="name"
            optionValue="id"
            placeholder="Cylinder type"
            class="line-row__type"
            [fluid]="true"
          ></p-select>
          <p-inputnumber formControlName="quantity" [min]="1" class="line-row__qty" [fluid]="true" />
          <button
            pButton
            type="button"
            text
            severity="danger"
            [disabled]="lines.length <= 1"
            (click)="removeLine($index)"
          >
            <i pButtonIcon class="pi pi-trash"></i>
          </button>
        </div>
        }
      </div>
      }
      </div>
    </form>

    <ng-template #footer>
      <div class="modal-actions">
        <button pButton type="button" severity="secondary" text (click)="closeCreateDrawer()">Cancel</button>
        <button
          pButton
          type="button"
          [loading]="loading()"
          [disabled]="createForm.invalid || !selectedAddress() || loading()"
          (click)="onSubmitCreate()"
        >Create Booking</button>
      </div>
    </ng-template>
  </p-drawer>
</div>
