<h2 class="section-heading">TDT (Targeted Delivery Time) Rating</h2>

<div class="data-toolbar">
  <div class="data-toolbar__filters">
    <p-select
      id="tdt_quarter"
      ariaLabel="Period"
      [options]="quarterOptions"
      optionLabel="label"
      optionValue="value"
      [ngModel]="selectedQuarter()"
      (ngModelChange)="onQuarterChange($event)"
    ></p-select>
  </div>
</div>

@if (errorMessage()) {
<lpg-empty-state
  tone="error"
  title="Couldn't load TDT rating"
  [description]="errorMessage() ?? ''"
/>
} @else if (isEmpty()) {
<lpg-empty-state
  title="No qualifying orders in this period"
  description="No rating yet. It counts orders booked and delivered in this period."
/>
} @else { @if (bandsMissing()) {
<lpg-empty-state
  title="Star bands are not configured"
  description="Orders were delivered in this period, but no TDT star bands are set, so no rating can be given. An admin can set them under Settings › TDT Rating."
/>
}
<div class="tdt-summary">
  <lpg-section-card heading="Overall Rating" class="tdt-summary__rating">
    <lpg-star-rating [stars]="overallStars()" size="lg" />
    <p class="tdt-summary__period">{{ periodLabel() }}</p>
  </lpg-section-card>

  <lpg-stat-card
    label="Delivered Orders"
    [value]="totalOrders()"
    icon="pi pi-truck"
    [loading]="loading()"
    caption="in this period"
  />
</div>

<lpg-data-grid
  [rows]="distribution()"
  [columns]="columns"
  [loading]="loading()"
  [autoHeight]="true"
  ariaLabel="TDT rating distribution by star band"
/>
}
