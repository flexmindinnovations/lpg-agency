<h2 class="section-heading">Driver Performance</h2>

<lib-report-filters (apply)="load($event)" (exportCsv)="exportCsv()" />

@if (store.error()) {
<lpg-empty-state
  tone="error"
  title="Couldn't load driver performance"
  [description]="store.error() ?? ''"
/>
} @else {
<lpg-data-grid
  [rows]="store.driverPerformance()"
  [columns]="columns"
  [loading]="store.loading()"
  [autoHeight]="true"
  [pageSize]="10"
  ariaLabel="Driver performance by driver and day"
/>
}
