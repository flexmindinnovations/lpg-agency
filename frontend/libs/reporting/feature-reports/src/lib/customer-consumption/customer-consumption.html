<lpg-section-card heading="Customer Consumption Report">
  @if (store.error()) {
  <lpg-empty-state
    tone="error"
    title="Couldn't load customer consumption"
    [description]="store.error() ?? ''"
  />
  } @else {
  <lpg-data-grid
    [rows]="store.customerConsumption()"
    [columns]="columns"
    [loading]="store.loading()"
    [autoHeight]="true"
    ariaLabel="Customer consumption report"
  />
  }
</lpg-section-card>
