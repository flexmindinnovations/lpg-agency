<h2 class="section-heading">GST Filing Summary</h2>

@if (store.loading()) {
  <div class="loading-state">Loading report...</div>
} @else if (store.error()) {
  <div class="error-state">{{ store.error() }}</div>
} @else {
  <p-table [value]="store.gstFiling()" [tableStyle]="{ 'min-width': '50rem' }" styleClass="p-datatable-striped">
    <ng-template pTemplate="header">
      <tr>
        <th>Filing Period</th>
        <th>Total GST</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-record>
      <tr>
        <td>{{ record.filing_period }}</td>
        <td>{{ record.total_gst | currency:'INR' }}</td>
      </tr>
    </ng-template>
    <ng-template pTemplate="emptymessage">
      <tr>
        <td colspan="2" class="empty-message">No GST filing data available.</td>
      </tr>
    </ng-template>
  </p-table>
}
