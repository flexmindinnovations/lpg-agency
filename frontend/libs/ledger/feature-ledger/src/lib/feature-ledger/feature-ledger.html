<div class="ledger-container">
  <div class="page-header">
    <ng-template lpgHeaderTitlePortal>
      <div class="page-header__text">
      <h1 class="page-title">Cylinder Balances</h1>
      <p class="page-subtitle">Manage customer cylinder balances and adjustments.</p>
    </div>
    </ng-template>
    <ng-template lpgHeaderPortal>
  <div class="page-header__actions">
        <button
          id="adjust-balance-btn"
          pButton
          type="button"
          (click)="openAdjustModal()"
        >
          <i pButtonIcon class="pi pi-sliders-h"></i>
          <span pButtonLabel>Adjust Balance <kbd class="ml-1 text-xs opacity-70">Alt+J</kbd></span>
        </button>
      </div>
</ng-template>
  </div>

  @if (loading()) {
    <p class="empty-hint">Loading ledger...</p>
  } @else {
    <div class="balance-list">
      @for (balance of enrichedBalances(); track balance.cylinder_type_id) {
        <div class="balance-item">
          <div>
            <span class="text-sm font-medium">{{ balance.name }}</span>
          </div>
          <div class="balance-quantity">
            <span [class.negative]="balance.quantity < 0" [class.positive]="balance.quantity > 0">
              {{ balance.quantity }}
            </span>
          </div>
        </div>
      } @empty {
        <p class="empty-hint">No cylinder balances recorded yet.</p>
      }
    </div>
  }
</div>

<!-- Adjust Balance Drawer -->
<p-drawer
  header="Adjust Balance"
  [visible]="adjustModalVisible()"
  (visibleChange)="closeAdjustModal()"
  position="right"
  [modal]="true"
  styleClass="w-full md:w-[30rem]"
  [closeOnEscape]="true"
  closeAriaLabel="Close dialog"
  (onHide)="onDrawerHide()"
>
  <form [formGroup]="adjustForm" (ngSubmit)="submitAdjustment()" class="dialog-form">
    <lpg-form-field
      label="Cylinder type"
      for="cylinder_type_id"
      [control]="adjustForm.controls.cylinder_type_id"
      [messages]="fieldMessages.cylinder_type_id"
    >
      <p-select
        inputId="cylinder_type_id"
        formControlName="cylinder_type_id"
        [options]="cylinderTypes()"
        optionLabel="name"
        optionValue="id"
        appendTo="body"
        [autofocus]="true"
        [fluid]="true"
      />
    </lpg-form-field>

    <lpg-form-field
      label="Delta (quantity)"
      for="delta"
      [control]="adjustForm.controls.delta"
      [messages]="fieldMessages.delta"
      hint="Use negative numbers for cylinders the customer owes the agency."
    >
      <input pInputText id="delta" type="number" formControlName="delta" [fluid]="true" />
    </lpg-form-field>

    <lpg-form-field
      label="Reason for adjustment"
      for="reason"
      [control]="adjustForm.controls.reason"
      [messages]="fieldMessages.reason"
    >
      <input
        pInputText
        id="reason"
        type="text"
        formControlName="reason"
        placeholder="e.g. Lost cylinder, manual correction"
        [fluid]="true"
      />
    </lpg-form-field>

    <div class="modal-actions">
      <button pButton type="button" severity="secondary" (click)="closeAdjustModal()">
        Cancel
      </button>
      <button pButton type="submit" [loading]="isSubmitting()">Apply Adjustment</button>
    </div>
  </form>
</p-drawer>
