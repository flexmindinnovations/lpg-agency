<div class="admin-page">
  <div class="page-header">
    <ng-template lpgHeaderTitlePortal>
      <div class="page-header__text">
        <h1 class="page-title">Notifications</h1>
        <p class="page-subtitle">View and manage your recent notifications.</p>
      </div>
    </ng-template>
  </div>

    <div class="data-toolbar">
      <div class="data-toolbar__filters"></div>
      <div class="data-toolbar__actions">
        <button pButton severity="secondary" (click)="markAllAsRead()"><i class="pi pi-check-circle"></i><span>Mark All as Read</span></button>
      </div>
    </div>

    <section class="grid-section">
      <lpg-data-grid
        [rows]="notifications()"
        [columns]="columns"
        [loading]="loading()"
        ariaLabel="Notifications"
      />
    </section>
</div>
