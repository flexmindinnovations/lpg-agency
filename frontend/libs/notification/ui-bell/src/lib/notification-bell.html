<p-overlaybadge
  [value]="unreadCount() > 99 ? '99+' : unreadCount() > 0 ? unreadCount().toString() : ''"
  [badgeDisabled]="unreadCount() === 0"
  severity="danger"
>
  <button
    pButton
    type="button"
    text
    rounded
    severity="secondary"
    iconOnly
    [attr.aria-label]="unreadCount() > 0 ? 'Notifications, ' + unreadCount() + ' unread' : 'Notifications'"
    (click)="toggled.emit()"
  >
    <i class="pi pi-bell"></i>
  </button>
</p-overlaybadge>
