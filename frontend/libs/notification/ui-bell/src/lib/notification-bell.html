<p-overlaybadge
  [value]="unreadCount() > 0 ? unreadCount().toString() : ''"
  [badgeDisabled]="unreadCount() === 0"
  severity="danger">
  <button pButton type="button" text rounded severity="secondary" (click)="toggled.emit()">
    <i pButtonIcon class="pi pi-bell"></i>
  </button>
</p-overlaybadge>
